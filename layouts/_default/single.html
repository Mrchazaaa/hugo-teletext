{{ define "main" }}
  {{ partial "topline.html" (dict "pageNumber" (.Params.pageNumber | default site.Params.pageNumber)) }}
  {{ partial "headline.html" (dict "title" .Title "subtitle" (upper (.Date.Format "02 Jan 2006"))) }}

  <section class="content-panel">
    <article class="post-body">
      {{ .Content }}
    </article>
    <hr class="post-footer-divider"/>
    <a class="post-footer-link" href="{{ `posts/` | relURL }}">ALL POSTS</a>
  </section>
{{ end }}
