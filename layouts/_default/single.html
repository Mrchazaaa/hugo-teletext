{{ define "main" }}
  {{ partial "topline.html" (dict "pageNumber" (.Params.pageNumber | default site.Params.pageNumber)) }}
  {{ partial "headline.html" (dict "title" .Title "subtitle" (.Date.Format "02 JAN 2006")) }}

  <section class="content-panel">
    <article class="post-body">
      {{ .Content }}
    </article>

    <a href="{{ `posts/` | relURL }}">ALL POSTS</a>
  </section>
{{ end }}
