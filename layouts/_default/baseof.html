<!DOCTYPE html>
<html lang="{{ site.Language.Locale | default `en` }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} | {{ site.Title }}{{ end }}</title>
  <link rel="icon" type="image/x-icon" href="{{ `star.ico` | relURL }}">
  <link rel="apple-touch-icon" href="{{ `star.ico` | relURL }}">
  <link rel="preload" href="{{ `fonts/MODE7GX3.TTF` | relURL }}" as="font" type="font/ttf" crossorigin>
  {{ $teletextCSS := resources.Get "scss/teletext.scss" | toCSS (dict "targetPath" "css/teletext.css") }}
  <link rel="stylesheet" href="{{ $teletextCSS.RelPermalink }}">
  {{ partial "head-metadata.html" . }}
  {{ partial "head-extra.html" . }}
</head>
<body{{ if site.Params.enableScanlines }} class="scanlines-enabled"{{ end }}>
  <main class="page" aria-label="{{ if .IsHome }}{{ .Title }} portfolio{{ else }}{{ .Title }}{{ end }}">
    {{ block "main" . }}{{ end }}
  </main>
  {{ if .Param "showFooter" }}
    {{ partial "footer-navbar.html" . }}
  {{ end }}
  <script src="{{ `js/clock.js` | relURL }}" defer></script>
</body>
</html>
