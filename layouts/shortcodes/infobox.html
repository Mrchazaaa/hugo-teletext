{{- $title := .Get "title" -}}
{{- $border := ne (lower (.Get "border" | default "true")) "false" -}}

<aside class="infobox{{ if $border }} teletext-box{{ end }}">
  {{- with $title }}
    <span class="infobox__title">{{ . }}</span>
  {{- end }}
  <div class="infobox__content"> {{- .Page.RenderString (dict "display" "block") .Inner -}} </div>
</aside>
